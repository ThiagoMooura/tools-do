let current = 0;
const frame = document.getElementById('frame');
const counter = document.getElementById('counter');
function show(index) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  frame.src = 'data:text/html;base64,' + slides[current];
  counter.textContent = (current + 1) + ' / ' + slides.length;
}
function next() { show(current + 1); }
function prev() { show(current - 1); }
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.addEventListener('keydown', (event) => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); prev(); }
  else if (event.key === 'Home') { event.preventDefault(); show(0); }
  else if (event.key === 'End') { event.preventDefault(); show(slides.length - 1); }
});
show(0);
